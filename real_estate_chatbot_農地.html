<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>農地特約事項網頁demo</title>
  <style>
    :root {
      --ink:#17211d; --muted:#68746e; --line:#d8dedb; --soft:#f5f7f6;
      --green:#245c47; --green-2:#34745a; --amber:#a04b11; --amber-bg:#fff7ed;
      --danger:#a72d2d; --white:#fff; --shadow:0 8px 24px rgba(25,43,35,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#edf1ef; font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; letter-spacing:0; }
    button,input,select,textarea { font:inherit; letter-spacing:0; }
    button { cursor:pointer; }
    body > header { min-height:64px; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; background:#fff; border-bottom:1px solid var(--line); }
    .brand h1 { margin:0; font-size:20px; }
    .brand span { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .header-actions,.clause-actions,.topic-actions { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .btn { min-height:36px; padding:7px 12px; border:1px solid transparent; border-radius:6px; background:var(--green); color:#fff; font-weight:700; }
    .btn:hover { background:var(--green-2); }
    .btn:disabled { opacity:.38; cursor:not-allowed; }
    .btn.secondary { border-color:var(--line); background:#fff; color:var(--ink); }
    .btn.danger { border-color:#e7b5b5; background:#fff; color:var(--danger); }
    .btn.small { min-height:30px; padding:4px 8px; font-size:12px; }
    .layout { display:grid; grid-template-columns:280px minmax(480px,1fr) minmax(360px,470px); min-height:calc(100vh - 64px); }
    aside,main,.result-panel { min-width:0; padding:14px; }
    aside { background:#f8faf9; border-right:1px solid var(--line); }
    main { border-right:1px solid var(--line); }
    .result-panel { background:#f8faf9; }
    .side-tabs { display:grid; grid-template-columns:repeat(2,1fr); gap:4px; margin-bottom:12px; }
    .side-tab { min-height:38px; padding:6px 4px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--muted); font-size:12px; font-weight:700; }
    .side-tab.active { border-color:var(--green); background:var(--green); color:#fff; }
    .side-panel[hidden] { display:none; }
    .section,.output-block { margin-bottom:12px; background:#fff; border:1px solid var(--line); border-radius:7px; box-shadow:var(--shadow); }
    .section { padding:14px; }
    .section-title,.output-title { margin:0; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:15px; }
    .section-subtitle { margin:7px 0 0; color:var(--muted); font-size:12px; line-height:1.6; }
    .fields { display:grid; gap:10px; margin-top:12px; }
    .field { display:grid; gap:5px; color:var(--muted); font-size:12px; font-weight:700; }
    input,select,textarea { width:100%; border:1px solid #cbd3cf; border-radius:5px; background:#fff; color:var(--ink); padding:8px 9px; outline:none; }
    input:focus,select:focus,textarea:focus { border-color:var(--green-2); box-shadow:0 0 0 2px rgba(52,116,90,.12); }
    .question-list { display:grid; gap:12px; }
    .question { background:#fff; border:1px solid var(--line); border-radius:7px; box-shadow:var(--shadow); overflow:hidden; }
    .question-head { padding:13px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
    .question-title { margin:0; font-size:15px; line-height:1.5; }
    .risk-tag,.tag { display:inline-flex; align-items:center; min-height:24px; padding:2px 7px; border-radius:4px; background:#edf5f1; color:var(--green); font-size:11px; font-weight:700; white-space:nowrap; }
    .risk-tag.high { background:#fff0f0; color:var(--danger); }
    .exclude-btn { width:30px; height:30px; padding:0; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--muted); font-size:19px; line-height:1; }
    .question-body { padding:13px 14px; }
    .topic-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .check-option { min-height:42px; padding:8px 9px; display:flex; align-items:flex-start; gap:8px; border:1px solid var(--line); border-radius:5px; background:var(--soft); font-size:13px; line-height:1.45; }
    .check-option input { width:17px; height:17px; margin:1px 0 0; flex:0 0 auto; accent-color:var(--green); }
    .topic-detail { margin-top:12px; padding:12px; border-left:3px solid var(--green-2); background:#f8faf9; }
    .topic-detail h4 { margin:0 0 10px; font-size:14px; }
    .topic-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .topic-fields .wide { grid-column:1/-1; }
    .inline-preview { margin-top:10px; padding-top:10px; border-top:1px dashed #bdc8c2; color:#30423a; font-size:13px; line-height:1.75; }
    .version-tools { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .version-switch { display:inline-flex; border:1px solid #bdc8c2; border-radius:5px; overflow:hidden; }
    .version-switch button { border:0; padding:7px 12px; background:#fff; color:var(--green); }
    .version-switch button[aria-pressed="true"] { background:var(--green); color:#fff; }
    .version-switch button:focus-visible { outline:2px solid #b45309; outline-offset:-3px; }
    .version-comparison { display:grid; gap:10px; margin-top:12px; }
    .comparison-text { white-space:pre-wrap; }
    .version-label { color:var(--muted); font-weight:400; margin-left:6px; }
    .remedy-field { margin:12px 0; font-size:13px; }
    .remedy-field > span { display:block; margin-bottom:5px; }
    .remedy-menu { position:relative; }
    .remedy-menu summary { padding:9px 11px; min-height:38px; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; list-style-position:inside; }
    .remedy-menu summary:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    .remedy-options { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:10; display:grid; gap:4px; padding:6px; border:1px solid var(--line); border-radius:5px; background:#fff; box-shadow:0 6px 18px #0002; }
    .remedy-menu:not([open]) .remedy-options { display:none; }
    .remedy-options .check-option { min-width:0; }
    .preview-label { display:block; margin-bottom:4px; color:var(--green); font-size:11px; font-weight:700; }
    .question.excluded .question-head { border-bottom:0; }
    .excluded-note { padding:0 14px 13px; color:var(--muted); font-size:12px; }
    .manage-list { display:grid; gap:8px; margin-top:10px; }
    .manage-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:8px; border:1px solid var(--line); border-radius:5px; font-size:12px; line-height:1.45; }
    .output-title { padding:10px 12px; border-bottom:1px solid var(--line); }
    .output-body { padding:12px; }
    .clause-list { display:grid; gap:10px; }
    .clause { padding:10px 11px; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .clause-head { margin-bottom:7px; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--green); font-size:12px; font-weight:700; }
    .clause textarea { min-height:96px; resize:vertical; border:0; padding:0; line-height:1.75; }
    .manual-badge { display:inline-flex; align-items:center; min-height:28px; padding:3px 8px; border:1px solid #b45309; border-radius:4px; background:var(--amber-bg); color:#9a3412; font-size:12px; font-weight:700; white-space:nowrap; }
    .manual-badge.added { border-color:#34745a; background:#edf7f2; color:#245c47; }
    .manual-badge[hidden] { display:none; }
    .empty-state { margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
    .risk-list,.missing-list { margin:0; padding-left:20px; font-size:13px; line-height:1.65; }
    .risk-list li.danger { color:var(--danger); }
    .risk-list li.warn { color:var(--amber); }
    .chat-log { height:300px; overflow:auto; padding:10px; border:1px solid var(--line); border-radius:5px; background:var(--soft); }
    .chat-message { margin-bottom:8px; padding:8px 9px; border-radius:5px; background:#fff; font-size:13px; line-height:1.55; }
    .chat-message.system { border-left:3px solid var(--green); }
    .chat-compose { display:grid; gap:8px; margin-top:9px; }
    .chat-compose textarea { min-height:74px; resize:vertical; }
    .toast { position:fixed; left:50%; bottom:22px; z-index:20; transform:translate(-50%,18px); padding:9px 14px; border-radius:5px; background:#17211d; color:#fff; opacity:0; pointer-events:none; transition:.18s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .print-area { display:none; }
    @media (min-width:1181px) {
      body { overflow:hidden; }
      .layout { height:calc(100vh - 64px); min-height:0; overflow:hidden; }
      aside,main,.result-panel { height:100%; overflow-y:auto; scrollbar-gutter:stable; }
    }
    @media (max-width:1180px) { .layout { grid-template-columns:260px 1fr; } .result-panel { grid-column:1/-1; border-top:1px solid var(--line); } main { border-right:0; } }
    @media (max-width:760px) { body > header { align-items:flex-start; flex-direction:column; } .header-actions { width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); } .header-actions .btn { width:100%; } .layout { display:block; } aside,main,.result-panel { border:0; padding:10px; } .topic-options,.topic-fields { grid-template-columns:1fr; } .topic-fields .wide { grid-column:auto; } }
    @media print {
      @page { size:A4; margin:0; }
      body { background:#fff; color:#000; overflow:visible; }
      body > header,.layout,.toast { display:none !important; }
      .print-area { display:block; font-family:"Microsoft JhengHei","Noto Sans TC",serif; font-size:12pt; line-height:1.75; }
      .contract-page { position:relative; width:210mm; height:296.8mm; overflow:hidden; background:#fff; break-inside:avoid-page; page-break-inside:avoid; }
      .contract-page:not(:last-child) { break-after:page; page-break-after:always; }
      .contract-header { position:absolute; z-index:3; top:11.5mm; left:16.5mm; right:16.5mm; height:13mm; }
      .contract-brand { position:absolute; top:0; left:0; width:82mm; height:auto; }
      .contract-number { position:absolute; top:7mm; right:0; white-space:nowrap; font-size:11pt; }
      .contract-number-value { display:inline-block; min-width:34mm; padding:0 1.5mm 1mm; border-bottom:.3mm solid #222; text-align:center; }
      .contract-watermark { position:absolute; z-index:0; top:86mm; left:50%; width:105mm; transform:translateX(-50%); opacity:.13; }
      .contract-content { position:absolute; z-index:2; top:28mm; left:18mm; right:18mm; bottom:14mm; height:auto; min-height:0; padding:0; border:0; overflow:visible; scrollbar-gutter:auto; }
      .contract-page.is-last .contract-content { bottom:78mm; }
      .contract-title { margin:0 0 9mm; font-family:"DFKai-SB","BiauKai","Microsoft JhengHei",serif; font-size:24pt; line-height:1.1; }
      .contract-clauses { margin:0; padding-left:9mm; }
      .contract-clauses li { margin-bottom:3mm; padding-left:1mm; break-inside:avoid; text-align:justify; white-space:pre-wrap; overflow-wrap:anywhere; }
      .contract-clauses li.is-continuation { list-style:none; }
      .contract-signatures { position:absolute; z-index:2; left:18mm; right:18mm; bottom:13.5mm; min-height:58mm; display:grid; align-content:end; gap:7mm; }
      .contract-page:not(.is-last) .contract-signatures { display:none; }
      .signature-row { display:grid; grid-template-columns:30mm 1fr 22mm; align-items:end; gap:3mm; }
      .signature-label { font-size:13pt; }
      .signature-line { height:10mm; border-bottom:.3mm solid #222; }
      .signature-seal { width:18mm; height:18mm; border:.3mm solid #222; }
      .contract-date { margin-top:4mm; display:flex; justify-content:space-between; font-size:13pt; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>農地特約事項網頁demo</h1><span>林宜慶地政士事務所</span></div>
    <div class="header-actions">
      <button class="btn secondary" id="loadSampleBtn" type="button">載入範例</button>
      <button class="btn secondary" id="resetBtn" type="button">恢復初始</button>
      <button class="btn" id="copyBtn" type="button">複製特約</button>
      <button class="btn" id="downloadBtn" type="button">匯出 PDF</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <nav class="side-tabs" aria-label="左側功能">
        <button class="side-tab active" type="button" data-panel="pdf">PDF 資料</button>
        <button class="side-tab" type="button" data-panel="ai">AI 聊天室</button>
      </nav>
      <section class="side-panel" data-panel-content="pdf">
        <div class="section">
          <h2 class="section-title">PDF 資料</h2>
          <div class="fields">
            <label class="field">契約書編號<input type="text" data-case="contractNo" placeholder="例如：11506012345" /></label>
            <label class="field">契約日期<input type="text" data-case="contractDate" placeholder="例如：115年6月10日" /></label>
          </div>
        </div>
      </section>
      <section class="side-panel" data-panel-content="ai" hidden>
        <div class="section">
          <h2 class="section-title">AI 聊天室</h2>
          <div class="chat-log" id="chatLog"><div class="chat-message system">AI 功能尚未連接。未來將可參考目前問答與特約草稿回答合約問題。</div></div>
          <div class="chat-compose"><textarea id="chatInput" placeholder="輸入合約問題" disabled></textarea><button class="btn" type="button" id="chatSendBtn" disabled>傳送</button></div>
        </div>
      </section>
    </aside>
    <main>
      <section class="section"><h2 class="section-title">農地題庫</h2></section>
      <div class="question-list" id="questionList"></div>
    </main>
    <section class="result-panel">
      <div class="output-block">
        <div class="output-title"><span>特約事項草稿</span><div class="topic-actions"><span class="tag" id="clauseCount">3 條</span><button class="btn secondary small" id="addClauseBtn" type="button">新增條文</button></div></div>
        <div class="output-body" id="clauseOutput"></div>
      </div>
      <div class="output-block"><div class="output-title">高風險提醒 <span class="tag" id="riskCount">0 項</span></div><div class="output-body" id="riskOutput"></div></div>
      <div class="output-block"><div class="output-title">待補資料 <span class="tag" id="missingCount">0 項</span></div><div class="output-body" id="missingOutput"></div></div>
    </section>
  </div>
  <div class="print-area" id="printArea"></div><div class="toast" id="toast"></div>
  <script>
    const FIXED_CLAUSES = [
      { id:"fixed-1", text:"買方於完稅款時，應依地政士通知，將辦理產權移轉所需之相關稅費、規費及代辦費匯入指定銀行帳戶。" },
      { id:"fixed-2", text:"雙方同意於辦理產權登記時，授權地政士依報稅日期訂立物權契約日期。" },
      { id:"fixed-3", text:"雙方合意以「林宜慶地政士事務所」為本約騎縫章。" }
    ];
    const f = (key,label,type="text",options=[],wide=false,placeholder="") => ({key,label,type,options,wide,placeholder});
    const questions = [
  {
    "id": "Q01",
    "title": "建築線",
    "risk": "高",
    "topics": [
      {
        "id": "buildingLine",
        "label": "建築線申請及核定",
        "fields": [
          {
            "key": "requirement",
            "label": "買方建築線需求",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "party",
            "label": "申請辦理人",
            "type": "select",
            "options": [
              "賣方",
              "買方"
            ],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "deadline",
            "label": "完成期限",
            "type": "date",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "resultType",
            "label": "應完成事項",
            "type": "select",
            "options": [
              "指定",
              "核定",
              "其他"
            ],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "condition",
            "label": "核定結果應符合條件",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "refundDays",
            "label": "解除後退款期限（日）",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          }
        ],
        "template": "雙方確認買方對本標的之建築線需求為{requirement}，並約定由{party}於民國{deadline}前向主管建築機關申請並完成建築線{resultType}，相關申請、測量、規費及其他必要費用均由賣方負擔。如屆期無法完成建築線指定或核定，或核定結果不符合買方約定之{condition}條件，買方得解除本契約；賣方應於契約解除之日起{refundDays}日內，無息返還已收受之全部價款，因本項申請及契約解除所生之必要費用亦由賣方負擔。",
        "briefTemplate": "本標的建築線由{party}於{deadline}前申請確認，費用由賣方負擔；如無法完成指定／核定或結果不符合{condition}，買方得解除契約，賣方應返還全部已收價款並負擔相關費用。"
      }
    ]
  },
  {
    "id": "Q02",
    "title": "建造執照",
    "risk": "高",
    "topics": [
      {
        "id": "permit",
        "label": "建造執照條件確認",
        "fields": [
          {
            "key": "requirement",
            "label": "買方建築需求",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "party",
            "label": "確認或取得人",
            "type": "select",
            "options": [
              "賣方",
              "買方"
            ],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "deadline",
            "label": "完成期限",
            "type": "date",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "permitCondition",
            "label": "應確認或取得內容",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "nature",
            "label": "結果約定性質",
            "type": "select",
            "options": [
              "僅供參考",
              "交易條件",
              "其他"
            ],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "failure",
            "label": "未達成時處理",
            "type": "textarea",
            "options": [],
            "wide": true,
            "placeholder": ""
          }
        ],
        "template": "買方購買本標的之建築需求為{requirement}。雙方約定由{party}於民國{deadline}前確認或取得{permitCondition}；其結果之約定性質為{nature}，未達成時依{failure}辦理。",
        "briefTemplate": "由{party}於{deadline}前確認／取得{permitCondition}建造執照條件，未達成時依{failure}處理。"
      }
    ]
  },
  {
    "id": "Q03",
    "title": "土地使用同意書",
    "risk": "高",
    "topics": [
      {
        "id": "consent",
        "label": "土地使用同意書",
        "fields": [
          {
            "key": "deadline",
            "label": "交付期限",
            "type": "date",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "landType",
            "label": "土地標示方式",
            "type": "select",
            "otherField": "landNo",
            "options": [
              "段、小段及地號",
              "其他"
            ],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "landSection",
            "label": "段",
            "type": "text",
            "placeholder": "例如：A",
            "when": { "key": "landType", "equals": "段、小段及地號" }
          },
          {
            "key": "landSubsection",
            "label": "小段（可留空）",
            "type": "text",
            "placeholder": "例如：B",
            "when": { "key": "landType", "equals": "段、小段及地號" }
          },
          {
            "key": "landNumber",
            "label": "地號",
            "type": "text",
            "placeholder": "例如：123-4",
            "when": { "key": "landType", "equals": "段、小段及地號" }
          },
          {
            "key": "landNo",
            "label": "其他土地標示",
            "type": "text",
            "when": { "key": "landType", "equals": "其他" },
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "scope",
            "label": "同意使用範圍",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "purpose",
            "label": "用途",
            "type": "text",
            "options": [],
            "wide": false,
            "placeholder": ""
          },
          {
            "key": "period",
            "label": "使用期限",

    function buildResult() {
      const generated=[...FIXED_CLAUSES], missing=[], risks=[];

      const system=generated.map(item=>{
        const existing=state.drafts[item.id];
        if(!existing) state.drafts[item.id]={generated:item.text,value:item.text,dirty:false};

    function splitClauses(clauses) {
      // Measure with the actual print rules, isolated from the visible application.
      const host=document.createElement("div");
      host.style.cssText="position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none";
      const shadow=host.attachShadow({mode:"open"});
      const styles=[...document.querySelectorAll("style")].map(style=>style.textContent.replace(/@media\s+print\s*\{/g,"@media all {")).join("\n");
      shadow.innerHTML=`<style>${styles}</style><div class="print-area"><section class="contract-page"><main class="contract-content"><h1 class="contract-title">特約事項：</h1><ol class="contract-clauses"></ol></main>${signatureHtml()}</section></div>`;
      document.body.appendChild(host);
      try {
        const page=shadow.querySelector(".contract-page"),content=shadow.querySelector(".contract-content"),list=shadow.querySelector("ol"),signatures=shadow.querySelector(".contract-signatures");
        let remainingSpace=0;
        const fits=(entries,last)=>{
          page.classList.toggle("is-last",last);
          list.replaceChildren(...entries.map(entry=>{
            const li=document.createElement("li"); li.value=entry.number; li.textContent=entry.text;
            li.classList.toggle("is-continuation",!!entry.continued); return li;
          }));
          const bottom=list.lastElementChild?.getBoundingClientRect().bottom||list.getBoundingClientRect().top;
          const limit=last?Math.min(content.getBoundingClientRect().bottom,signatures.getBoundingClientRect().top-8*96/25.4):content.getBoundingClientRect().bottom;
          remainingSpace=limit-bottom;
          return remainingSpace>=2;
        };
        const pending=clauses.map((text,index)=>({text:String(text),number:index+1,continued:false})),pages=[];
        while(pending.length){
          if(fits(pending,true)){pages.push(pending.splice(0));break;}
          const current=[];
          while(pending.length&&fits([...current,pending[0]],false)) current.push(pending.shift());
          if(pending.length){
            // Fill remaining space; continue a split clause without renumbering it.
            const entry=pending[0],characters=Array.from(entry.text);
            let low=1,high=characters.length,best=0;
            while(low<=high){
              const middle=Math.floor((low+high)/2);
              if(fits([...current,{...entry,text:characters.slice(0,middle).join("")}],false)){best=middle;low=middle+1;}else high=middle-1;
            }
            if(best){
              current.push({...entry,text:characters.slice(0,best).join("")});
              pending[0]={...entry,text:characters.slice(best).join(""),continued:true};
            } else if(!current.length) throw new Error("PDF 條文無法排入頁面");
          }
          // Keep the preceding page full; move only a short final clause or tail.
          if(!pending.length&&!fits(current,true)){
            const entry=current.at(-1),lineHeight=parseFloat(getComputedStyle(list).lineHeight);
            const wholeFits=fits([entry],true),entryHeight=list.lastElementChild.getBoundingClientRect().height;
            if(current.length>1&&wholeFits&&entryHeight<=5*lineHeight){
              pages.push(current.slice(0,-1),[entry]);break;
            }
            const characters=Array.from(entry.text);
            let low=1,high=characters.length-1,best=null;
            while(low<=high){
              const middle=Math.floor((low+high)/2);
              const prefix=[...current.slice(0,-1),{...entry,text:characters.slice(0,middle).join("")}];
              const suffix=[{...entry,text:characters.slice(middle).join(""),continued:true}];
              const prefixFits=fits(prefix,false),suffixFits=fits(suffix,true);
              const tailHeight=list.lastElementChild.getBoundingClientRect().height;
              if(prefixFits&&suffixFits&&tailHeight>=3*lineHeight) best={prefix,suffix};
              if(tailHeight>=3*lineHeight) low=middle+1; else high=middle-1;
            }
            if(!best) throw new Error("PDF 簽章頁無法完成分頁");
            pages.push(best.prefix,best.suffix);break;
          }
          pages.push(current);
        }
        return pages.length?pages:[[]];
      } finally { host.remove(); }
    }

        const last=pageIndex===pages.length-1;
        return `<section class="contract-page${last?" is-last":""}"><header class="contract-header"><img class="contract-brand" src="assets/yiqing-header.png" alt="宜慶地政 服務專線 06-2951356"/><div class="contract-number">契約書編號：<span class="contract-number-value">${esc(contractNo)}</span></div></header><img class="contract-watermark" src="assets/yiqing-watermark.png" alt=""/><main class="contract-content"><h1 class="contract-title">特約事項：</h1><ol class="contract-clauses">${clauses.map(entry=>`<li value="${entry.number}"${entry.continued?' class="is-continuation"':""}>${esc(entry.text)}</li>`).join("")}</ol></main>${last?signatureHtml():""}</section>`;
      }).join("");
    }
    async function waitForPrintLayout(container) {
      const images=[...container.querySelectorAll("img")];
      await Promise.all(images.map(async image=>{
        if(!image.complete) await new Promise(resolve=>{ image.addEventListener("load",resolve,{once:true}); image.addEventListener("error",resolve,{once:true}); });
        if(image.decode) { try { await image.decode(); } catch {} }
      }));
      if(document.fonts?.ready) await document.fonts.ready;
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    }
    async function exportPdf() { const result=buildResult(),area=$("printArea"); showToast("正在準備 PDF 格式"); if(document.fonts?.ready) await document.fonts.ready; area.innerHTML=printDocument(result.items); await waitForPrintLayout(area); showToast("請在列印視窗選擇另存為 PDF"); window.print(); }
    function showToast(text) { const toast=$("toast"); toast.textContent=text; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.classList.remove("show"),1800); }
    function resetAll() { state.selected={}; state.values={}; state.excluded={}; state.drafts={}; state.manual=[]; state.order=[]; state.versions={}; state.comparing={}; state.remedies={}; state.remedyMenuOpen=false; document.querySelectorAll("[data-case]").forEach(input=>input.value=""); $("printArea").innerHTML=""; renderQuestions(); updateOutput(); switchPanel("pdf"); showToast("已恢復初始狀態"); }
    function confirmReset() { if(window.confirm("確定要恢復初始狀態嗎？目前填寫的答案、人工條文及修改內容都會被清除，且無法復原。")) resetAll(); }
    function loadSample() {
      resetAll(); document.querySelector('[data-case="contractNo"]').value="1151013001"; document.querySelector('[data-case="contractDate"]').value="115年10月13日";
      state.selected["Q04.survey"]=true; state.values["Q04.survey.party"]="賣方"; state.values["Q04.survey.deadline"]="115年11月30日"; state.values["Q04.survey.difference"]="登記面積百分之一"; state.values["Q04.survey.adjustment"]="按單價找補"; state.values["Q04.survey.unitPrice"]="每平方公尺新臺幣12,000元"; state.values["Q04.survey.noSurvey"]="不適用，本案約定辦理鑑界";
      state.selected["Q07.objects"]=true; state.values["Q07.objects.retained"]="現有果樹及滴灌設備"; state.values["Q07.objects.party"]="賣方"; state.values["Q07.objects.deadline"]="115年12月15日"; state.values["Q07.objects.feeParty"]="賣方";
      state.selected["A01.agriculturalUse"]=true; state.values["A01.agriculturalUse.scenario"]="一般農地"; state.values["A01.agriculturalUse.deadline"]="115年12月31日"; state.values["A01.agriculturalUse.refundDays"]="7";
      state.selected["A02.harvest"]=true; state.values["A02.harvest.current"]="芒果樹三十株及當期果實"; state.values["A02.harvest.handledItems"]="當期果實"; state.values["A02.harvest.handler"]="賣方"; state.values["A02.harvest.deadline"]="115年11月30日"; state.values["A02.harvest.assumedItems"]="芒果樹及既有灌溉管線"; state.values["A02.harvest.handover"]="收成完成後三日內"; state.values["A02.harvest.overdue"]="視為放棄，由買方依現況處理";
      state.values["Q04.survey.surveyChoice"]="辦理";
      questions.forEach(question=>question.topics.forEach(topic=>topic.fields.filter(field=>field.type==="date").forEach(field=>{const key=keyOf(question.id,topic.id,field.key);if(state.values[key]) state.values[key]=isoDate(state.values[key]);})));
      renderQuestions(); updateOutput(); showToast("已載入範例");
    }
    document.addEventListener("click",event=>{const menu=document.querySelector("[data-remedy-menu]");if(menu?.open && !event.target.closest("[data-remedy-menu]")){menu.open=false;state.remedyMenuOpen=false;}});
    document.addEventListener("keydown",event=>{const menu=document.querySelector("[data-remedy-menu]");if(event.key==="Escape" && menu?.open){menu.open=false;state.remedyMenuOpen=false;menu.querySelector("summary").focus();}});
    document.querySelectorAll(".side-tab").forEach(button=>button.addEventListener("click",()=>switchPanel(button.dataset.panel)));
    document.querySelectorAll("[data-case]").forEach(input=>input.addEventListener("input",updateOutput));
    $("addClauseBtn").addEventListener("click",addManualClause); $("copyBtn").addEventListener("click",copyClauses); $("downloadBtn").addEventListener("click",exportPdf); $("resetBtn").addEventListener("click",confirmReset); $("loadSampleBtn").addEventListener("click",loadSample);
    renderQuestions(); updateOutput(); switchPanel("pdf");
  </script>
</body>
</html>
